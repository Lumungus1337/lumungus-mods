name: Build and Game Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify modules and server game tests
        run: |
          chmod +x gradlew
          ./gradlew clean build :lumungus-storage:runGameTest :lumungus-machines:runGameTest :lumungus-integration:runGameTest

      - name: Package installable Lumungus update
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$version"
          mkdir -p build/install/mods
          for module in core storage machines integration; do
            cp "modules/lumungus-${module}/build/libs/lumungus-${module}-${version}.jar" build/install/mods/
          done
          cp docs/storage/INSTALLATION.md build/install/INSTALLATION.md
          cp docs/storage/BULK_CRAFTING.md build/install/BULK_CRAFTING.md
          git rev-parse HEAD > build/install/COMMIT.txt
          cd build/install
          sha256sum mods/*.jar > SHA256SUMS.txt
          echo "name=lumungus-storage-${version}" >> "$GITHUB_OUTPUT"

      - name: Upload verified installation package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/install/
          if-no-files-found: error
          retention-days: 90
