name: Build and Game Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify modules and server game tests
        run: |
          chmod +x gradlew
          ./gradlew :lumungus-storage:test :lumungus-storage:runGameTest :lumungus-machines:runGameTest :lumungus-integration:runGameTest
