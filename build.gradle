plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
}

allprojects {
    group = maven_group
    version = mod_version
}

configure(project(":lumungus-core")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-storage")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-backpack")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-machines")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-integration")) {
    configureLumungusModule(project)
}

void configureLumungusModule(Project moduleProject) {
    moduleProject.with {
    apply plugin: "fabric-loom"
    apply plugin: "java-library"
    apply plugin: "maven-publish"

    base {
        archivesName = project.name
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    loom {
        splitEnvironmentSourceSets()

        mods {
            "${project.name.replace("-", "_")}" {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:intermediary:${intermediary_version}:v2"
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "minecraft_version", minecraft_version
        inputs.property "loader_version", loader_version

        filesMatching("fabric.mod.json") {
            expand(
                "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version
            )
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = project.name
                from components.java
            }
        }
    }
    }
}
