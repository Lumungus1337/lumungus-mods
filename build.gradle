plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
}

allprojects {
    group = maven_group
    version = mod_version
}

configure(project(":lumungus-core")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-storage")) {
    configureLumungusModule(project)

    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "lumungus_storage_gametest"
            enableGameTests = true
            enableClientGameTests = true
            eula = true
        }
    }
}

configure(project(":lumungus-backpack")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-machines")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-autotrader")) {
    configureLumungusModule(project)
}

configure(project(":lumungus-integration")) {
    configureLumungusModule(project)

    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "lumungus_integration_gametest"
            enableGameTests = true
            eula = true
        }
    }
}

void configureLumungusModule(Project moduleProject) {
    moduleProject.with {
    apply plugin: "net.fabricmc.fabric-loom"
    apply plugin: "java-library"
    apply plugin: "maven-publish"

    base {
        archivesName = project.name
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    loom {
        splitEnvironmentSourceSets()

        mods {
            "${project.name.replace("-", "_")}" {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "minecraft_version", minecraft_version
        inputs.property "loader_version", loader_version

        filesMatching("fabric.mod.json") {
            expand(
                "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version
            )
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = project.name
                from components.java
            }
        }
    }
    }
}

tasks.register("storageUatBundle", Zip) {
    group = "distribution"
    description = "Builds the Lumungus Storage UAT bundle with Core, Storage, Machines, and the test checklist."
    dependsOn(
        ":lumungus-core:jar",
        ":lumungus-core:check",
        ":lumungus-storage:jar",
        ":lumungus-storage:check",
        ":lumungus-machines:jar",
        ":lumungus-machines:check"
    )

    archiveFileName = "lumungus-storage-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir("uat")

    from({ project(":lumungus-core").tasks.named("jar").get().archiveFile.get().asFile }) {
        into "mods"
    }
    from({ project(":lumungus-storage").tasks.named("jar").get().archiveFile.get().asFile }) {
        into "mods"
    }
    from({ project(":lumungus-machines").tasks.named("jar").get().archiveFile.get().asFile }) {
        into "mods"
    }
    from("docs/storage") {
        include "UAT*.md"
        include "images/**"
    }
}

tasks.register("tomsMigrationUatBundle", Zip) {
    group = "distribution"
    description = "Builds the read-only Tom's migration UAT bundle with Core, Storage, and Integration."
    dependsOn(
        ":lumungus-core:jar",
        ":lumungus-core:check",
        ":lumungus-storage:jar",
        ":lumungus-storage:check",
        ":lumungus-storage:runGameTest",
        ":lumungus-integration:jar",
        ":lumungus-integration:check",
        ":lumungus-integration:runGameTest"
    )

    archiveFileName = "lumungus-toms-migration-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir("uat")

    from({ project(":lumungus-core").tasks.named("jar").get().archiveFile.get().asFile }) {
        into "mods"
    }
    from({ project(":lumungus-storage").tasks.named("jar").get().archiveFile.get().asFile }) {
        into "mods"
    }
    from({ project(":lumungus-integration").tasks.named("jar").get().archiveFile.get().asFile }) {
        into "mods"
    }
    from("docs/storage") {
        include "TOMS_MIGRATION.md"
        include "TOMS_MIGRATION_UAT.md"
        include "TOMS_MIGRATION_UAT_RESULTS_*.md"
    }
}
